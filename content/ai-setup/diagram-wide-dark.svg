<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 823" width="720" height="823" class="dark" role="img" aria-labelledby="t d">
<title id="t">How Orlando&#x27;s AI setup fits together.</title>
<desc id="d">Orlando chats with a Claude Code session from the Mac or his phone. Orlando uses his apps: Corillo (review documents with an agent), Brega (a to-do list shared with agents), Pregón (publish a post), and Latido (a window onto the heartbeat). Corillo and Brega pass comments, edits, and tasks to a session and back. While Orlando is away, the Heartbeat (jobs on a timer) and the Relay (a roadmap, one fresh session per batch) start sessions. A session reads the rules at the start: global, workspace, and project. Settings and hooks check each step a session takes. A session can use 11 skills: close-shop, save-session, process-feedback, tune-setup, connect, publish-setup, podcast, relay, heartbeat, rex, and evals. A session can work as one of 3 custom agents: writer, trainer, and financial advisor. A session reads and writes the files on the Mac: the knowledge base (an Obsidian vault), projects (by area, in dated folders), tools (finished and reusable), and scratch (throwaway files). The files are kept under local version history and backed up to the cloud.</desc>
<style>
.light{--card:#fff;--ink:#1e1e1e;--soft:#6c6c6c;--line:#d0d0d0;--hair:#e6e6e6;--slate:#4F6D7A;--slate-ink:#36505B;--slate-tint:#DCE6EA;--on:#fff;--coral:#CC7354;--coral-ink:#8A3F2A;--coral-tint:#F6DDD3}
.dark{--card:#2e2e33;--ink:#dadadb;--soft:#9b9c9d;--line:#55565a;--hair:#3c3d41;--slate:#84A6B5;--slate-ink:#A9C6D3;--slate-tint:#2C3C43;--on:#142024;--coral:#D58868;--coral-ink:#EBA48D;--coral-tint:#4A2E25}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,'Open Sans','Helvetica Neue',sans-serif;font-size:12px;fill:var(--soft)}
.name{font-size:14px;font-weight:600;fill:var(--ink)}
.cap{font-size:12.5px;font-weight:600;fill:var(--soft)}
.big{font-size:17px;font-weight:700}
.on{fill:var(--on)}
.t-slate{fill:var(--slate-ink)}
.t-coral{fill:var(--coral-ink)}
.mid{text-anchor:middle}
.end{text-anchor:end}
.icon{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.c-ink{color:var(--ink)}.c-soft{color:var(--soft)}.c-slate{color:var(--slate)}.c-coral{color:var(--coral)}.c-on{color:var(--on)}
.card{fill:var(--card);stroke:var(--hair);stroke-width:1.5}
.l-coral{fill:none;stroke:var(--coral);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.l-slate{fill:none;stroke:var(--slate);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.l-soft{fill:none;stroke:var(--line);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dash{stroke-dasharray:1 7}
</style>
<defs>
