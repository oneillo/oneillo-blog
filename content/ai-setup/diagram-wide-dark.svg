<symbol id="i-guard" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.500-3 8-7 10-4-2-7-5.500-7-10V6zM9 12l2.200 2.200L15.200 10"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M5 5.500A2.500 2.500 0 0 1 7.500 3H19v14H7.500A2.500 2.500 0 0 0 5 19.500zM5 19.500A2.500 2.500 0 0 0 7.500 21H19v-4M9 7.500h6"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.500h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
<symbol id="i-tool" viewBox="0 0 24 24"><path d="M14.500 5.500a4.200 4.200 0 0 0-5 5.300L4 16.300 7.700 20l5.500-5.500a4.200 4.200 0 0 0 5.300-5l-2.800 2.800-2.300-.700-.700-2.300z"/></symbol>
<symbol id="i-scratch" viewBox="0 0 24 24"><path stroke-dasharray="2.500 3" d="M3 7a2 2 0 0 1 2-2h4l2 2.500h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
<symbol id="i-history" viewBox="0 0 24 24"><path d="M4.500 12a7.500 7.500 0 1 0 2.300-5.400L4.500 9M4.500 4.500V9H9M12 8v4.300l3 1.700"/></symbol>
<symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18.500h10.500a4 4 0 0 0 .600-7.950A6 6 0 0 0 6.400 9.600 4.500 4.500 0 0 0 7 18.500z"/></symbol>
<symbol id="i-app" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 12h6"/></symbol>
</g>
