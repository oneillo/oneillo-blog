<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1491" width="360" height="1491" class="light" role="img" aria-labelledby="t d">
<title id="t">How Orlando&#x27;s AI setup fits together.</title>
<desc id="d">Orlando chats with a Claude Code session from the Mac or his phone. Orlando uses his apps: Corillo (review documents with an agent), Brega (a to-do list shared with agents), Pregón (publish a post), and Latido (a window onto the heartbeat). Corillo and Brega pass comments, edits, and tasks to a session and back. While Orlando is away, the Heartbeat (jobs on a timer) and the Relay (a roadmap, one fresh session per batch) start sessions. A session reads the rules at the start: global, workspace, and project. Settings and hooks check each step a session takes. A session can use 11 skills: close-shop, save-session, process-feedback, tune-setup, connect, publish-setup, podcast, relay, heartbeat, rex, and evals. A session can work as one of 3 custom agents: writer, trainer, and financial advisor. A session reads and writes the files on the Mac: the knowledge base (an Obsidian vault), projects (by area, in dated folders), tools (finished and reusable), and scratch (throwaway files). The files are kept under local version history and backed up to the cloud. How the setup improves: Orlando&#x27;s corrections are saved as feedback memories. A tune-up with the process-feedback and tune-setup skills turns them into proposed changes. Checks show that a change is no worse before it goes in: Evals (the eval tool: agents, models, and instruction files) and skill picking (Claude Code&#x27;s built-in plugin eval: whether each skill gets picked when it should). With Orlando&#x27;s OK, the changes go into the rules, skills, and agents.</desc>
