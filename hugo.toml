baseURL = "https://oneillo.com/"
languageCode = "en-us"
title = "Orlando O'Neill"  # Change to whatever you want
theme = "PaperMod"

[params]
  description = "How I build and use AI agents at work and at home, plus marketing, data, and whatever I'm curious about."
  mainSections = ["posts"]  # keeps the homepage/archive to hand-written posts only; the AI Digest section (content/newsletter/) is separate
  defaultTheme = "auto"  # auto switches between light/dark based on OS
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowFullTextinRSS = true
  ShowShareButtons = true
  disableSpecial1stPost = true
  ShareButtons = ["linkedin", "x"]

[params.schema]
  publisherType = "Person"  # a personal blog: search engines read the site as a person, not a company
  sameAs = ["https://www.linkedin.com/in/oneillo/"]  # ties the site to his profile for search engines

[taxonomies]
  tag = "tags"  # tags only: the blog doesn't use categories, so Hugo makes no empty /categories/ page

# Settings for groups of pages, picked by address.
[[cascade]]
  [cascade.params]
    author = "Orlando O'Neill"  # posts name their author (beside the date, and for search engines); the AI Digest and AI Setup pages don't get it from here
  [cascade.target]
    path = "/posts/**"

[[cascade]]
  [cascade.params]
    robotsNoIndex = true  # the search page has nothing of its own for search engines to show
  [cascade.sitemap]
    disable = true  # and it stays out of the sitemap
  [cascade.target]
    path = "/search"

[menu]
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 25
  [[menu.main]]
    identifier = "archive"
    name = "Archive"
    url = "/archives/"
    weight = 10
  [[menu.main]]
    identifier = "newsletter"
    name = "AI Digest"
    url = "/newsletter/"
    weight = 5
  [[menu.main]]
    identifier = "ai-setup"
    name = "AI Setup"
    url = "/ai-setup/"
    weight = 7
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "rss"
    name = "RSS"
    url = "/index.xml"
    weight = 30

[markup.goldmark.renderer]
  unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]  # JSON enables search if you want it later
